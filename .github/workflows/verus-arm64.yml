name: verus-arm64
# Builds each Verus variant on real arm64 hardware, proves it is bit-identical to baseline,
# and runs a short single-thread benchmark. Runner CPUs are server cores (not Exynos), so use the
# numbers only to compare variants against each other, never as phone hashrates.
on:
  push:
    branches: [variants]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make autoconf automake libtool pkg-config binutils \
            libcurl4-openssl-dev libjansson-dev libssl-dev zlib1g-dev
      - name: Show CPU
        run: |
          grep -m1 Features /proc/cpuinfo
          grep -m1 'CPU part' /proc/cpuinfo
      - name: Build variants and run difftest
        run: |
          set -e
          exec > >(tee build.log) 2>&1
          mkdir -p out
          # *jt4: the same code with jump tables for switches of 4+ cases (LLVM 18 made it 13+ on AArch64, which turns
          # the 8-way case switch of the hash into a compare tree); the -mllvm option must reach the LTO link
          for v in baseline pristine x2 x2sel2 x2percore x2percorep baselinejt4 x2percorepjt4; do
            jt=""; case "$v" in *jt4) jt=4; v0=${v%jt4};; *) v0=$v;; esac
            case "$v0" in baseline) fl="";; zipmix) fl="-DVERUS_ZIPMIX";; x2) fl="-DVERUS_X2";;
              x3) fl="-DVERUS_X2 -DVERUS_LANES=3";; x4) fl="-DVERUS_X2 -DVERUS_LANES=4";;
              x2auto) fl="-DVERUS_X2 -DVERUS_AUTO";; x2fuse) fl="-DVERUS_X2 -DVERUS_FUSE";; x2sel) fl="-DVERUS_X2 -DVERUS_SEL14";; x2sel2) fl="-DVERUS_X2 -DVERUS_SEL14 -DVERUS_SEL18";; x2percore) fl="-DVERUS_X2 -DVERUS_AUTO -DVERUS_PERCORE";; x2sel3) fl="-DVERUS_X2 -DVERUS_SEL3";;
              pristine) fl="-DVERUS_PRISTINE";; x2percorep) fl="-DVERUS_X2 -DVERUS_AUTO -DVERUS_PERCORE -DVERUS_PRISTINE";; esac
            rm -rf "b-$v"; mkdir "b-$v"
            git ls-files -z | grep -zv '\.o$' | xargs -0 cp --parents -t "b-$v"
            ( cd "b-$v"
              find . -name '*.o' -delete; rm -f ccminer *.opt.yaml config.status
              if [ -n "$jt" ]; then sed -i "s#^extracflags=\"#extracflags=\"-mllvm -aarch64-min-jump-table-entries=$jt #; s#LDFLAGS=\"-v -flto#LDFLAGS=\"-v -flto -Wl,-mllvm,-aarch64-min-jump-table-entries=$jt#" configure.sh; grep -c min-jump-table configure.sh; fi
              ./configure.sh
              make -j"$(nproc)" CPPFLAGS="$fl" )
            cp "b-$v/ccminer" "out/ccminer-$v"
            echo "$v: aese=$(objdump -d out/ccminer-$v | grep -cE '\baese\b') pmull=$(objdump -d out/ccminer-$v | grep -cE '\bpmull2?\b') br=$(objdump -d out/ccminer-$v | grep -cE '\sbr\s+x')"
          done
          CFL="-O2 -march=armv8-a+crypto -fno-strict-aliasing -I. -Iverus"
          clang $CFL -Dharaka512_keyed=haraka512_keyed_base -Dharaka512_keyed_x2=haraka512_keyed_x2_base -c verus/haraka.c -o hb.o
          clang $CFL -DVERUS_ZIPMIX -Dharaka512_keyed=haraka512_keyed_var -Dharaka512_keyed_x2=haraka512_keyed_x2_var -c verus/haraka.c -o hv.o
          clang $CFL tests/verus_difftest.c hb.o hv.o -o difftest
          ./difftest 2000000 | tee difftest.txt
          grep -q PASS difftest.txt
          clang -O2 -march=armv8-a+crypto -fno-strict-aliasing -I. -Iverus -c verus/haraka.c -o hk.o
          clang -O2 -march=armv8-a+crypto -fno-strict-aliasing -I. -Iverus -c verus/haraka_portable.c -o hkp.o
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -I. -Iverus \
            -c verus/verus_clhash_portable.cpp -o clx2.o
          for n in 2 3 4; do
            clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_LANES=$n -I. -Iverus \
              tests/verus_x2test.cpp clx2.o hk.o hkp.o -o x2test$n
            ./x2test$n 100000 | tee -a difftest.txt
          done
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_FUSE -I. -Iverus \
            -c verus/verus_clhash_portable.cpp -o clfuse.o
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_FUSE -I. -Iverus \
            tests/verus_x2test.cpp clfuse.o hk.o hkp.o -o x2testfuse
          ./x2testfuse 300000 | sed 's/x2test/x2test fuse/' | tee -a difftest.txt
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_SEL14 -I. -Iverus \
            -c verus/verus_clhash_portable.cpp -o clsel.o
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_SEL14 -I. -Iverus \
            tests/verus_x2test.cpp clsel.o hk.o hkp.o -o x2testsel
          ./x2testsel 300000 | sed 's/x2test/x2test sel/' | tee -a difftest.txt
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_SEL14 -DVERUS_SEL18 -I. -Iverus \
            -c verus/verus_clhash_portable.cpp -o clsel2.o
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_SEL14 -DVERUS_SEL18 -I. -Iverus \
            tests/verus_x2test.cpp clsel2.o hk.o hkp.o -o x2testsel2
          ./x2testsel2 300000 | sed 's/x2test/x2test sel2/' | tee -a difftest.txt
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_SEL3 -I. -Iverus \
            -c verus/verus_clhash_portable.cpp -o clsel3.o
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_SEL3 -I. -Iverus \
            tests/verus_x2test.cpp clsel3.o hk.o hkp.o -o x2testsel3
          ./x2testsel3 300000 | sed 's/x2test/x2test sel3/' | tee -a difftest.txt
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_FUSE64 -I. -Iverus \
            -c verus/verus_clhash_portable.cpp -o clf64.o
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_FUSE64 -I. -Iverus \
            tests/verus_x2test.cpp clf64.o hk.o hkp.o -o x2testf64
          ./x2testf64 300000 | sed 's/x2test/x2test fuse64+sel2/' | tee -a difftest.txt
          # SEL bit 16 (light merge of cases 0/4/8/0x1c) and bit 32 (branch-free case 0x0c), alone and on top of sel2
          for f in 16 32 48 19 35 51 64 67 99 39 128 131 163 227 256 259 291 355 384 387 419 483 512 515 547 640 643 675 768 771 803 896 899 931; do
            clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_SEL_FORCE=$f -I. -Iverus \
              tests/verus_x2test.cpp clx2.o hk.o hkp.o -o x2testsel$f
            ./x2testsel$f 300000 | sed "s/x2test/x2test SEL $f/" | tee -a difftest.txt
          done
          # one lane through the same round code (single-nonce cores, VERUS_SEL1)
          for f in 128 129 130 131 160 163 192 224 640 672; do
            clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_LANES=1 -DVERUS_SEL_FORCE=$f -I. -Iverus \
              tests/verus_x2test.cpp clx2.o hk.o hkp.o -o x2test1sel$f
            ./x2test1sel$f 200000 | sed "s/x2test/x2test 1-lane SEL $f/" | tee -a difftest.txt
          done
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -I. -Iverus \
            -c verus/verus_clhash_portable.cpp -o clplain.o
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -I. -Iverus \
            tests/verus_pristinetest.cpp clplain.o hk.o hkp.o -o pristinetest
          ./pristinetest 300000 | tee -a difftest.txt
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DPRISTINE_PRE -I. -Iverus \
            tests/verus_pristinetest.cpp clplain.o hk.o hkp.o -o pristinetestpre
          ./pristinetestpre 300000 | tee -a difftest.txt
          grep -q 'pristinetest preload.*PASS' difftest.txt
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -I. -Iverus \
            tests/verus_fullchecktest.cpp clplain.o hk.o hkp.o -o fullchecktest
          ./fullchecktest 200000 | tee -a difftest.txt
          grep -q 'fullchecktest.*PASS' difftest.txt
          for v in baseline pristine x2percore x2percorep; do echo "banner $v: $(./out/ccminer-$v --version 2>&1 | grep -o 'Verus variant: .*' | head -1)" | tee -a difftest.txt; done
          ! grep -q FAIL difftest.txt
          [ "$(grep -c 'x2test.*PASS' difftest.txt)" = 52 ]
          grep -q 'pristinetest.*PASS' difftest.txt
      - name: One-step build script (build-verus.sh, system clang)
        run: |
          bash build-verus.sh --system-clang | tee bv.log | tail -5
          grep -q "restoring jump tables" bv.log
          ./ccminer-verus --version 2>&1 | grep -q 'Verus variant: x2percore+pristine'
          hs=$(./ccminer-verus -a verus --benchmark -t 1 --time-limit 10 --no-color 2>&1 | grep -E '^[0-9]+$' | tail -1)
          echo "build-verus.sh ok, 1T ${hs:-NONE} H/s" | tee -a difftest.txt
      - name: API JSON output (summary.json / threads.json over HTTP and the plain socket)
        run: |
          ./ccminer-verus -a verus --benchmark -t 2 -b 127.0.0.1:4068 --no-color > api-miner.log 2>&1 &
          MP=$!; sleep 8
          curl -s -i http://127.0.0.1:4068/summary.json | tee api.txt | head -5
          curl -s http://127.0.0.1:4068/summary.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("summary ok, KHS", d["KHS"])' | tee -a api.txt
          curl -s http://127.0.0.1:4068/threads.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("threads ok,", len(d), "threads")' | tee -a api.txt
          printf 'pool.json' | timeout 5 nc -q 2 127.0.0.1 4068 | tr -d '\000' | python3 -c 'import json,sys; json.load(sys.stdin); print("socket pool.json ok")' | tee -a api.txt
          printf 'summary' | timeout 5 nc -q 2 127.0.0.1 4068 | tr -d '\000' | grep -q '^NAME=' && echo "plain summary unchanged" | tee -a api.txt
          kill $MP
          echo "api: $(grep -E 'ok|unchanged' api.txt | tr '\n' ';')" | tee -a difftest.txt
          [ "$(grep -cE ' ok|unchanged' api.txt)" = 4 ]
      - name: Selector statistics
        run: |
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_STATS -I. -Iverus \
            -c verus/verus_clhash_portable.cpp -o cls.o
          clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 -DVERUS_X2 -DVERUS_STATS -I. -Iverus \
            tests/verus_stats.cpp cls.o hk.o hkp.o -o vstats
          ./vstats 400000 | tee stats.txt
      - name: Ablation timings (what does each cost?)
        run: |
          # Deliberately wrong hashes: each build removes ONE thing to show the most that optimising it could win.
          build() { # name flags
            clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 $2 -I. -Iverus -c verus/verus_clhash_portable.cpp -o "abl-$1-cl.o"
            clang++ -O2 -march=armv8-a+crypto -fno-strict-aliasing -std=gnu++11 $2 -I. -Iverus tests/verus_ablate.cpp "abl-$1-cl.o" hk.o hkp.o -o "abl-$1"
          }
          build full ""
          build nodiv "-DVERUS_ABL_NODIV"
          build innerfix "-DVERUS_ABL_INNER_FIXED"
          build switchfix "-DVERUS_ABL_SWITCH_FIXED"
          build nofix "-DVERUS_ABL_NOFIX"
          build noharaka "-DVERUS_ABL_NOHARAKA"
          build nomulhrs "-DVERUS_ABL_NOMULHRS"
          build all4 "-DVERUS_ABL_NODIV -DVERUS_ABL_INNER_FIXED -DVERUS_ABL_SWITCH_FIXED -DVERUS_ABL_NOFIX"
          build pristine "-DVERUS_PRISTINE"   # a real variant (correct hashes), timed in the same harness
          # the same ablations on the two-nonce path (x2): what still limits it?
          for a in full:"" nodiv:-DVERUS_ABL_NODIV innerfix:-DVERUS_ABL_INNER_FIXED switchfix:-DVERUS_ABL_SWITCH_FIXED nofix:-DVERUS_ABL_NOFIX noharaka:-DVERUS_ABL_NOHARAKA nomulhrs:-DVERUS_ABL_NOMULHRS; do
            build "x2${a%%:*}" "-DVERUS_X2 ${a#*:}"
          done
          for r in 1 2 3; do for v in full pristine nodiv innerfix switchfix nofix noharaka nomulhrs all4 x2full x2nodiv x2innerfix x2switchfix x2nofix x2noharaka x2nomulhrs; do
            echo "$v $(./abl-$v 4)" | tee -a ablate.txt; done; done
      - name: Benchmark (1 thread, 3 alternating rounds, 20 s)
        run: |
          for r in 1 2 3; do
            for v in x2percorepjt4:35 x2percorepjt4:547 x2percorepjt4:419 x2percorepjt4:931 x2percorepjt4:675; do
              b=${v%%:*}; e=""; [ "$b" != "$v" ] && e="VERUS_SEL=${v#*:}"
              hs=$(env $e ./out/ccminer-$b -a verus --benchmark -t 1 --time-limit 20 --no-color 2>&1 | grep -E '^[0-9]+$' | tail -1)
              echo "round $r $v ${hs:-NONE} H/s" | tee -a bench.txt
            done
          done
      - name: Publish results as annotations
        if: always()
        run: |
          [ -f build.log ] && echo "::notice title=buildlog::$(grep -v '^make\|^  CXX\|^  CC' build.log | tail -25 | tr '\n' '|' | cut -c1-3500)"
          echo "::notice title=cpu::$(grep -m1 'CPU part' /proc/cpuinfo) | $(grep -m1 Features /proc/cpuinfo | cut -c1-120)"
          [ -f stats.txt ] && echo "::notice title=stats::$(tr '\n' '|' < stats.txt)"
          [ -f ablate.txt ] && echo "::notice title=ablate::$(tr '\n' '|' < ablate.txt)"
          [ -f difftest.txt ] && echo "::notice title=difftest::$(tr '\n' ';' < difftest.txt)"
          [ -f bench.txt ] && for l in "$(cat bench.txt | tr '\n' ';')"; do echo "::notice title=bench::$l"; done
          cat bench.txt difftest.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: verus-arm64-results
          path: |
            bench.txt
            difftest.txt

  # Separate job: (1) are AES round pairs (AESE+AESMC) kept adjacent so the core can fuse them?
  # (2) does profile-guided optimisation (clang PGO) help the plain loop or the two-nonce path?
  analysis:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make autoconf automake libtool pkg-config binutils \
            libcurl4-openssl-dev libjansson-dev libssl-dev zlib1g-dev
      - name: Build (normal, PGO-instrumented, PGO-optimised)
        run: |
          set -e
          FL="-DVERUS_X2 -DVERUS_AUTO -DVERUS_PERCORE -DVERUS_PRISTINE"
          build() { # dir extra-flags
            rm -rf "$1"; mkdir "$1"
            git ls-files -z | grep -zv '\.o$' | xargs -0 cp --parents -t "$1"
            ( cd "$1"; find . -name '*.o' -delete; rm -f ccminer *.opt.yaml config.status
              if [ -n "$2" ]; then
                sed -i "s#^extracflags=\"#extracflags=\"$2 #" configure.sh
                sed -i "s#LDFLAGS=\"-v -flto#LDFLAGS=\"-v -flto $2#" configure.sh
              fi
              ./configure.sh >/dev/null && make -j"$(nproc)" CPPFLAGS="$FL" >/dev/null 2>make.err || { tail -30 make.err; exit 1; } )
          }
          build b-norm ""
          build b-inst "-fprofile-instr-generate"
          # training: plain loop, two-nonce sel2 (this core's default), two-nonce x2 (Mongoose M1/M2 path)
          cd b-inst
          LLVM_PROFILE_FILE=$PWD/p1.profraw VERUS_LANES=1 ./ccminer -a verus --benchmark -t 1 --time-limit 15 --no-color >/dev/null 2>&1
          LLVM_PROFILE_FILE=$PWD/p2.profraw ./ccminer -a verus --benchmark -t 1 --time-limit 15 --no-color >/dev/null 2>&1
          LLVM_PROFILE_FILE=$PWD/p3.profraw VERUS_SEL=0 ./ccminer -a verus --benchmark -t 1 --time-limit 10 --no-color >/dev/null 2>&1
          ls -la *.profraw
          llvm-profdata merge -o ../verus.profdata p1.profraw p2.profraw p3.profraw
          cd ..
          build b-pgo "-fprofile-use=$PWD/verus.profdata -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          for d in b-norm b-pgo; do
            objdump -d --no-show-raw-insn $d/ccminer > $d.dis
            echo "== $d" >> aes.txt
            python3 tools/aes_pairs.py < $d.dis | sort -t= -k2 -nr | head -8 >> aes.txt
          done
          cat aes.txt
      - name: Benchmark normal vs PGO (1 thread, plain loop and two-nonce path, 3 alternating rounds)
        run: |
          for r in 1 2 3; do
            order="b-norm b-pgo"; [ $((r % 2)) = 0 ] && order="b-pgo b-norm"
            for d in $order; do
              for p in plain twononce; do
                e=""; [ $p = plain ] && e="VERUS_LANES=1"
                hs=$(env $e ./$d/ccminer -a verus --benchmark -t 1 --time-limit 20 --no-color 2>&1 | grep -E '^[0-9]+$' | tail -1)
                echo "round $r $d $p ${hs:-NONE}" | tee -a pgo.txt
              done
            done
          done
          awk '{k=$3" "$4; s[k]+=$5; n[k]++} END{for(k in s) printf "%s mean %.0f\n", k, s[k]/n[k]}' pgo.txt | sort | tee -a pgo.txt
      - name: Publish
        if: always()
        run: |
          [ -f aes.txt ] && echo "::notice title=aes-pairs::$(tr '\n' '|' < aes.txt)"
          [ -f pgo.txt ] && echo "::notice title=pgo::$(tr '\n' '|' < pgo.txt)"

  # Separate job: the same miner (x2percore + pristine) built with GCC instead of clang.
  gcc:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc g++ make autoconf automake libtool pkg-config binutils \
            libcurl4-openssl-dev libjansson-dev libssl-dev zlib1g-dev
      - name: Build clang and gcc miners, gcc equivalence tests
        run: |
          set -e
          exec > >(tee gcc.log) 2>&1
          FL="-DVERUS_X2 -DVERUS_AUTO -DVERUS_PERCORE -DVERUS_PRISTINE"
          prep() { rm -rf "$1"; mkdir "$1"; git ls-files -z | grep -zv '\.o$' | xargs -0 cp --parents -t "$1"
                   ( cd "$1"; find . -name '*.o' -delete; rm -f ccminer *.opt.yaml config.status ); }
          prep b-clang; ( cd b-clang && ./configure.sh >/dev/null && make -j"$(nproc)" CPPFLAGS="$FL" >/dev/null 2>&1 )
          prep b-gcc
          ( cd b-gcc
            X="-O3 -ffast-math -mfix-cortex-a53-835769 -D_REENTRANT -falign-functions=16 -fomit-frame-pointer -fpic -pthread -flto=auto -fno-stack-protector -flax-vector-conversions"
            ./configure CC=gcc CXX=g++ AR=gcc-ar RANLIB=gcc-ranlib \
              CFLAGS="-finline-functions -march=armv8-a+crypto -mtune=cortex-a53 $X" \
              CXXFLAGS="-funroll-loops -finline-functions -march=armv8-a+crypto -mtune=cortex-a53 $X" \
              LDFLAGS="-flto=auto" >/dev/null
            make -j"$(nproc)" CPPFLAGS="$FL" > make.log 2>&1 || { grep -m30 -E 'error' make.log; exit 1; } )
          ls -la b-clang/ccminer b-gcc/ccminer
          G="-O2 -march=armv8-a+crypto -fno-strict-aliasing -flax-vector-conversions -I. -Iverus"
          gcc $G -c verus/haraka.c -o hk.o; gcc $G -c verus/haraka_portable.c -o hkp.o
          g++ $G -std=gnu++11 -DVERUS_X2 -DVERUS_SEL14 -DVERUS_SEL18 -c verus/verus_clhash_portable.cpp -o cl2.o
          g++ $G -std=gnu++11 -DVERUS_X2 -DVERUS_SEL14 -DVERUS_SEL18 tests/verus_x2test.cpp cl2.o hk.o hkp.o -o x2test
          ./x2test 200000 | sed 's/^/gcc /' | tee eq.txt
          g++ $G -std=gnu++11 -c verus/verus_clhash_portable.cpp -o cl.o
          g++ $G -std=gnu++11 tests/verus_pristinetest.cpp cl.o hk.o hkp.o -o pristinetest
          ./pristinetest 200000 | sed 's/^/gcc /' | tee -a eq.txt
          # the miner itself: same hash for the same work in both builds is checked by the tests above;
          # also check the gcc miner finds the benchmark rate in a sane range
          ! grep -q FAIL eq.txt
      - name: Benchmark clang vs gcc (1 thread, plain loop and two-nonce path, 3 alternating rounds)
        run: |
          for r in 1 2 3; do
            order="b-clang b-gcc"; [ $((r % 2)) = 0 ] && order="b-gcc b-clang"
            for d in $order; do for p in plain twononce; do
              e=""; [ $p = plain ] && e="VERUS_LANES=1"
              hs=$(env $e ./$d/ccminer -a verus --benchmark -t 1 --time-limit 20 --no-color 2>&1 | grep -E '^[0-9]+$' | tail -1)
              echo "round $r $d $p ${hs:-NONE}" | tee -a gccbench.txt
            done; done
          done
          awk '{k=$3" "$4; s[k]+=$5; n[k]++} END{for(k in s) printf "%s mean %.0f\n", k, s[k]/n[k]}' gccbench.txt | sort | tee -a gccbench.txt
      - name: Publish
        if: always()
        run: |
          [ -f eq.txt ] && echo "::notice title=gcc-eq::$(tr '\n' '|' < eq.txt)"
          [ -f gccbench.txt ] && echo "::notice title=gcc-bench::$(tr '\n' '|' < gccbench.txt)"
          [ -f gcc.log ] && echo "::notice title=gcc-log::$(tail -30 gcc.log | tr '\n' '|' | cut -c1-3000)"
